name = "zerorelay-signaling"
main = "src/index.ts"
compatibility_date = "2025-12-01"

# Set in the Cloudflare dashboard (Settings > Variables and Secrets):
#   IP_SALT          secret: salt for hashing client IPs into network keys
#   ALLOWED_ORIGINS  text:   comma-separated sites allowed to use this worker

# Keep dashboard-set variables when deploying from this file.
keep_vars = true

[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "WORLD_DO"
class_name = "WorldDO"

[observability]
logs = { enabled = true }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WorldDO"]
